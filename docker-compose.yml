services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: congratulator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # скрипт выполняется один раз при создании пустой базы
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d congratulator"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ../../AppData/Local/Temp
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/congratulator
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      APP_STORAGE_ROOT: /data/uploads
    ports:
      - "8081:8081"
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
