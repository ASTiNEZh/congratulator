# Профиль "test". Подключение к БД задаёт Testcontainers (@ServiceConnection),
# поэтому spring.datasource.* из application.properties здесь не используются.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-test.sql

# Тестовое хранилище файлов внутри build/, а не в /data/uploads
app.storage.root=build/test-uploads
