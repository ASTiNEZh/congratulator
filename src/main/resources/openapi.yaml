openapi: 3.0.3
info:
  title: congratulator
  version: 0.0.1
servers:
  - url: http://localhost:8081
    description: адрес сервера
paths:
  /birthdays/new:
    post:
      operationId: rememberBirthday
      tags:
        - Birthday
      description: '"Запомнить" новое ДР'
      requestBody:
        description: Запись о ДР
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BirthdayDto'
        required: true
      responses:
        '200':
          description: Успешный ответ
        'default':
          description: Условия успешного ответа не удовлетворяются
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /:
    get:
      operationId: getActualBirthdaysList
      tags:
        - Birthday
      description: Возвращает ДР наступающие менее чем через 30 дней
      responses:
        '200':
          description: Успешный ответ
          content:
            mapplication/json:
              schema:
                $ref: '#/components/schemas/BirthdaysDtoList'
  /birthdays:
    get:
      operationId: getBirthdaysList
      tags:
        - Birthday
      description: Возвращает все ДР
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/sort'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BirthdaysDtoList'
  /birthdays/{uuid}:
    get:
      operationId: getBirthday
      tags:
        - Birthday
      description: Возвращает конкретный ДР
      parameters:
        - $ref: '#/components/parameters/uuid'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BirthdayDto'
        'default':
          description: Условия успешного ответа не удовлетворяются
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
    put:
      operationId: updateBirthday
      tags:
        - Birthday
      description: Обновление ДР
      parameters:
        - $ref: '#/components/parameters/uuid'
      requestBody:
        description: Обновлённое событие
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BirthdayDto'
        required: true
      responses:
        '200':
          description: Успешный ответ
        'default':
          description: Условия успешного ответа не удовлетворяются
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
    delete:
      operationId: deleteBirthday
      tags:
        - Birthday
      description: Удаление ДР
      parameters:
        - $ref: '#/components/parameters/uuid'
      responses:
        '200':
          description: Успешный ответ
        'default':
          description: Условия успешного ответа не удовлетворяются
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /files/upload:
    post:
      tags:
        - Photo
      summary: Загрузка одного или нескольких файлов
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                uuid:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Файлы успешно загружены
  /files/{id}:
    get:
      tags:
        - Photo
      summary: Скачивание файла по ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Файл изображения или любого типа
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
components:
  parameters:
    uuid:
      required: true
      name: uuid
      in: path
      schema:
        type: string
        format: uuid
    page:
      in: query
      name: page
      description: Начальное значение
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    size:
      in: query
      name: size
      description: Количество результатов, возвращаемых на страницу
      required: false
      schema:
        type: integer
        minimum: 1
        default: 20
    sort:
      in: query
      name: sort
      description: Направление сортировки (asc или desc)
      required: false
      schema:
        type: string
        enum: [ 'asc', 'desc' ]
  schemas:
    BirthdaysDtoList:
      title: Cписок ДР
      type: array
      items:
        $ref: '#/components/schemas/BirthdayDto'
    BirthdayDto:
      title: Запись о ДР
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          description: UUID события
          example: 00000000-0000-0000-0000-000000000001
        сelebrant:
          $ref: '#/components/schemas/CelebrantDto'
        birthDate:
          type: string
          format: date
          description: 'Дата рождения хранится именно в записи о ДР т.к. в иерархии сущностей ДР является доменирующей
           для выполнения поставленной задачи - уведомление о дне рождения. В таком случае сам по себе именниник
           носит вторичный харррактер. Следовательно, не смотря на то что дата рождения - это даннные которые
           пренадлежат имениннику, как доминирующая сущность, событие "День рождения" претендующее на
           обладание данными, забирает их себе. Возможно это спорное решение, но пока будет так'
          example: 2000-01-01
        status:
          type: string
          description: Статус ДР
          enum:
            - OTHER
            - RECENT
            - TODAY
            - UPCOMING
      required:
        - uuid
        - status
    CelebrantDto:
      title: Именинник
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          description: UUID именниника
          example: 10000000-0000-0000-0000-000000000000
        firstName:
          type: string
          description: Имя
          example: Иван
        lastName:
          type: string
          description: Отчество
          example: Иванович
        surname:
          type: string
          description: Фамилия
          example: Иванов
    ErrorDto:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string